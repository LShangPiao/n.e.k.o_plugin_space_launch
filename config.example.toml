[plugin_runtime]
enabled = true
auto_start = false

[space_launch]
# Launch Library 2 API 基础地址（带尾部斜杠）
api_base_url = "https://ll.thespacedevs.com/2.3.0/"
# NASA 技术报告库（NTRS）基础地址（带尾部斜杠）
ntrs_base_url = "https://ntrs.nasa.gov/"
# 百度百科基础地址（中文航天资料）
baike_base_url = "https://baike.baidu.com/"
# 网页兜底搜索基础地址
bing_base_url = "https://cn.bing.com/"
# 单次请求超时（秒）
timeout_seconds = 15
# 默认返回的即将发射数量
default_limit = 5
# 是否在下次发射/列表中附带任务描述
include_descriptions = true
# API 响应的内存缓存时间（秒）。Launch Library 2 免费额度约每小时 15 次请求，
# 建议不要设置得过小。
cache_ttl_seconds = 300