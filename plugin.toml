[plugin]
id = "space_launch"
name = "太空发射"
description = "查询下一次及未来多次太空发射任务，并支持检索航天器、火箭型号、空间站、航天机构与 NASA 技术文献。数据来源为 Launch Library 2 API 与 NASA NTRS。由星河拓航工作室 Galaxy Exploration Studio（航天科普组织）开发维护。"
short_description = "Query upcoming rocket launches and search spacecraft, launchers, space stations, agencies, astronauts and NASA technical literature."
keywords = [
    "太空", "发射", "火箭", "卫星", "航天", "下一次发射", "空间站", "宇航员", "航天器",
    "航天机构", "NASA", "文献", "资料", "查卫星",
    "space", "launch", "rocket", "satellite", "spaceflight", "spacecraft", "space station",
    "astronaut", "agency", "launchpad", "打ち上げ", "宇宙", "ロケット", "로켓", "발사",
    "космос", "запуск", "спутник"
]
version = "1.1.0"
type = "plugin"
entry = "plugin.plugins.space_launch:SpaceLaunchPlugin"

[plugin.author]
name = "星河拓航工作室 (Galaxy Exploration Studio)"
email = "1565873375@qq.com"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false

[space_launch]
# Launch Library 2 API 基础地址（带尾部斜杠）
api_base_url = "https://ll.thespacedevs.com/2.3.0/"
# NASA 技术报告库（NTRS）基础地址（带尾部斜杠）
ntrs_base_url = "https://ntrs.nasa.gov/"
# 单次请求超时（秒）
timeout_seconds = 15
# 默认返回的即将发射数量
default_limit = 5
# 是否在下次发射/列表中附带任务描述
include_descriptions = true
# API 响应的内存缓存时间（秒）
cache_ttl_seconds = 300